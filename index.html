<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1f7a59">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>English Coach</title>
<style>
:root{
  --bg:#f4f7f5;--surface:#ffffff;--surface2:#ecf2ef;--tx:#11221b;--mu:#5a6c63;--line:#e0e8e3;
  --p:#1f7a59;--p-d:#165c43;--p-soft:#e2f1ea;--on-p:#ffffff;
  --acc:#f2a516;--acc-soft:#fff4dc;
  --ok:#157a3d;--ok-soft:#e3f4ea;--er:#c0392b;--er-soft:#fdeceb;--wa:#a35a06;
  --shadow:0 1px 2px rgba(15,40,30,.05),0 8px 24px rgba(15,40,30,.07);
  --r:18px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d1613;--surface:#15221d;--surface2:#1c2d26;--tx:#e9f2ee;--mu:#9db1a8;--line:#263830;
    --p:#38b387;--p-d:#7ddbb6;--p-soft:#193428;--on-p:#062418;
    --acc:#f5b536;--acc-soft:#33290f;
    --ok:#4cc27d;--ok-soft:#15301f;--er:#ef7a6d;--er-soft:#37201d;--wa:#e7a04a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.45;padding-bottom:calc(88px + env(safe-area-inset-bottom))}
h2{font-size:1.3rem;margin:0 0 6px;line-height:1.25}
h3{font-size:1.02rem;margin:0}
p{margin:0 0 10px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* En-tête */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.08rem;letter-spacing:-.01em}
.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#2a9570,#155a43);color:#fff;display:grid;place-items:center}
.logo .ic{width:19px;height:19px;stroke-width:2.2}
.beta{font-size:.72rem;font-weight:700;color:var(--mu);background:var(--surface2);border-radius:99px;padding:4px 10px}

#app{max-width:560px;margin:0 auto;padding:18px 16px}
.view.anim{animation:fade .28s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Cartes */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.muted{color:var(--mu);font-size:.92rem}
.st{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.02rem;margin:0 0 12px}
.dot{width:32px;height:32px;border-radius:10px;background:var(--p-soft);color:var(--p-d);display:grid;place-items:center;flex:none}
.tip{background:var(--acc-soft);border-color:transparent;box-shadow:none}
.tip .dot{background:var(--acc);color:#3a2a00}
.page-h{margin:2px 2px 16px}
.page-h p{color:var(--mu);margin:0}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:700;border:0;border-radius:14px;padding:13px 18px;background:var(--p);color:var(--on-p);cursor:pointer;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.98);filter:brightness(.95)}
.btn.block{display:flex;width:100%;margin-top:10px}
.btn.soft{background:var(--p-soft);color:var(--p-d)}
.btn.ghost{background:transparent;color:var(--mu);padding-left:4px;padding-right:12px}
.btn.danger{background:var(--er-soft);color:var(--er)}
.btn.light{background:#fff;color:#14553f}
.btn:disabled{opacity:.5}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:var(--p-soft);color:var(--p-d);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ib:active{transform:scale(.94)}

/* Accueil */
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#2a9570 0%,#155a43 100%);color:#fff;border-radius:24px;padding:22px;margin-bottom:14px;box-shadow:0 10px 30px rgba(21,90,67,.28)}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero-row{position:relative;z-index:1;display:flex;align-items:center;gap:16px}
.hero h2{font-size:1.3rem;margin:0 0 6px}
.hero p{margin:0;opacity:.92;font-size:.95rem}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;font-weight:700;opacity:.8;margin-bottom:6px}
.hero .btn{position:relative;z-index:1}
.hero .rb{stroke:rgba(255,255,255,.25)}
.hero .rf{stroke:#fff}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:1.8rem;line-height:1.1;margin-top:4px}
.stat span{color:var(--mu);font-size:.85rem}

/* Anneaux */
.ringw{position:relative;flex:none}
.rb{fill:none;stroke:var(--surface2)}
.rf{fill:none;stroke:var(--p);stroke-linecap:round;animation:ring .9s ease-out}
@keyframes ring{from{stroke-dashoffset:var(--c)}}
.rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;text-align:center}
.rt b{font-size:1.15em}
.rt small{font-size:.7em;opacity:.8;margin-top:2px}

/* Puces et barres */
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--p-soft);color:var(--p-d);border-radius:99px;padding:4px 10px;font-size:.76rem;font-weight:700}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.mute{background:var(--surface2);color:var(--mu)}
.chip .ic{width:13px;height:13px;stroke-width:3}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:linear-gradient(90deg,var(--p),#4fcf9f);border-radius:99px;transition:width .3s}
.levels{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* Liste des leçons */
.lc{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.lc:active{transform:scale(.99)}
.num{width:46px;height:46px;border-radius:14px;background:var(--p-soft);color:var(--p-d);font-weight:800;display:grid;place-items:center;flex:none;font-size:1.05rem}
.num.done{background:var(--ok-soft);color:var(--ok)}
.lc-b{flex:1;min-width:0}
.lc-b h3{margin:6px 0 2px}
.lc-b p{margin:0;color:var(--mu);font-size:.88rem}
.chev{color:var(--mu)}

/* Leçon */
.lhead h2{margin:10px 0 8px;font-size:1.4rem}
.lhead p{margin:0;color:var(--mu)}
.exr{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.exr:first-of-type{border-top:0;padding-top:0}
.exl{flex:1;min-width:0}
.exb{display:flex;gap:8px}
.en{font-weight:700;font-size:1.05rem}
.vr{padding:10px 0;border-top:1px solid var(--line)}
.vr:first-of-type{border-top:0;padding-top:0}
.msg{margin-top:6px;font-size:.9rem}
.ok{color:var(--ok)}.err{color:var(--er)}.warn{color:var(--wa)}

/* Quiz */
.qh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-size:.88rem;color:var(--mu);font-weight:600}
.qq{font-size:1.2rem;font-weight:700;line-height:1.3;margin:16px 0 4px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:1rem;color:var(--tx);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;cursor:pointer}
.opt:active{transform:scale(.99)}
.opt .lt{width:30px;height:30px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;font-weight:800;font-size:.85rem;flex:none}
.opt .tx{flex:1}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .lt{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--er);background:var(--er-soft)}
.opt.wrong .lt{background:var(--er);color:#fff}
.opt:disabled{opacity:1;cursor:default}
.fb{margin-top:14px;padding:14px;border-radius:14px;display:flex;gap:10px;align-items:flex-start}
.fb.ok{background:var(--ok-soft);color:var(--tx)}
.fb.err{background:var(--er-soft);color:var(--tx)}
.fb b{display:block;margin-bottom:2px}
.fb.ok b,.fb.ok .ic{color:var(--ok)}
.fb.err b,.fb.err .ic{color:var(--er)}

/* Résultat */
.center{text-align:center}
.center .ringw{margin:6px auto 14px}
.res-t{font-size:1.5rem;font-weight:800;margin:0 0 6px}

/* Carnet */
.sumrow{display:flex;gap:12px}
.sumrow>div{flex:1}
.sumrow b{display:block;font-size:1.8rem;line-height:1.1}
.sumrow span{color:var(--mu);font-size:.85rem}
.wc-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wc-top .en{font-size:1.15rem}
.wc-fr{font-weight:600;margin:2px 0}
.wc-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:.8rem;color:var(--mu)}
.dots{display:flex;gap:4px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--p)}
.big{font-size:2rem;font-weight:800;letter-spacing:-.01em}
.rv{text-align:center;padding:26px 18px}
.rv .row{display:flex;justify-content:center;margin:10px 0}
.rates{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.rates .btn{padding:12px 6px;font-size:.88rem}
.empty{text-align:center;color:var(--mu);padding:26px 18px}
.empty .dot{margin:0 auto 10px;width:48px;height:48px;border-radius:16px}

/* Progrès */
.pr{display:flex;align-items:center;gap:18px}
.pr h3{margin-bottom:4px}
.pr p{margin:0}
.err-row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.err-row:first-of-type{border-top:0}

/* Navigation */
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--mu);font:inherit;font-size:.72rem;font-weight:600;padding:10px 4px 9px;cursor:pointer}
nav button .ic{width:23px;height:23px}
nav button.on{color:var(--p)}
nav button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 4px 4px;background:var(--p)}

/* Conversation */
body.chatmode{padding-bottom:calc(var(--nav-h,64px) + 96px + env(safe-area-inset-bottom))}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.cbtn{font:inherit;font-size:.85rem;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--mu);border-radius:99px;padding:7px 13px;cursor:pointer}
.cbtn.on{border-color:var(--p);background:var(--p-soft);color:var(--p-d)}
.starters{display:grid;gap:8px;margin-top:12px}
.b-row{display:flex;margin-bottom:10px}
.b-row.u{justify-content:flex-end}
.bub{max-width:88%;padding:12px 14px;border-radius:18px;line-height:1.4;overflow-wrap:anywhere}
.bub.u{background:var(--p);color:var(--on-p);border-bottom-right-radius:6px}
.bub.a{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;box-shadow:var(--shadow)}
.bub .en{font-size:1.02rem}
.bub .fr{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.bact{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.ib.sm{width:36px;height:36px}
.ib.sm .ic{width:17px;height:17px}
.tryc{display:block;margin-top:10px;padding:9px 12px;border-radius:12px;background:var(--acc-soft);font:inherit;font-size:.9rem;width:100%;text-align:left;border:0;color:var(--tx);cursor:pointer}
.corr{background:var(--acc-soft);border-radius:16px;padding:14px;margin:0 0 10px}
.corr-t{font-weight:800;font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--wa);margin-bottom:8px}
.c-old{color:var(--er);text-decoration:line-through;text-decoration-thickness:2px}
.c-new{color:var(--ok);font-weight:700;margin:2px 0 8px}
.typing{display:inline-flex;gap:5px;padding:4px 2px}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--mu);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.errbox{background:var(--er-soft);border-radius:14px;padding:12px 14px;margin-bottom:10px}
#composerHost{position:fixed;left:0;right:0;bottom:var(--nav-h,64px);z-index:9;background:var(--surface);border-top:1px solid var(--line)}
#composerHost:empty{display:none}
.composer{max-width:560px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;padding:10px 12px}
.composer textarea{flex:1;min-width:0;font:inherit;font-size:1rem;color:var(--tx);background:var(--surface2);border:2px solid transparent;border-radius:16px;padding:10px 14px;resize:none;max-height:120px;min-height:44px;outline:none}
.composer textarea:focus{border-color:var(--p)}
.ib.send{background:var(--p);color:var(--on-p)}
.ib.mic.live{background:var(--er);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(192,57,43,.22)}}
.cnote{max-width:560px;margin:0 auto;padding:8px 16px 0;font-size:.85rem;color:var(--mu)}
.cnote:empty{display:none}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>

</nav>

  function vProgress() {
    var total = LESSONS.length, done = doneCount(), words = Object.keys(data.vocab).length, h = '<div class="page-h"><h2>Progression</h2><p>Ton avancée, sans pression.</p></div>';
    h += '<div class="card"><div class="pr">' + ring(total ? done / total : 0, 96, 10, done + '/' + total, 'leçons') +
      '<div><h3>Leçons validées</h3><p class="muted">' + (total ? (total - done) + ' restante(s) pour le moment.' : 'Aucune leçon chargée.') + '</p></div></div></div>';
    h += '<div class="stats"><div class="stat"><span>Mots dans le carnet</span><b>' + words + '</b></div><div class="stat"><span>À réviser</span><b>' + dueWords().length + '</b></div></div>';
    var lv = ['Pré-A1', 'A1', 'A2', 'B1', 'B2', 'C1', 'C2'], chips = '';
    lv.forEach(function (l) { chips += '<span class="chip' + ((l === 'A1' || l === 'A2') && done ? '' : ' mute') + '">' + l + '</span>'; });
    h += '<div class="card"><div class="st"><span class="dot">' + ic('star') + '</span>Niveau estimé</div><p style="margin:0">' + (done ? 'A1 (en cours)' : 'Pas encore estimé') + '</p>' +
      '<div class="levels">' + chips + '</div>' +
      '<p class="muted" style="margin:12px 0 0">Estimation indicative basée sur les leçons validées. Ce n\'est pas une certification officielle.</p></div>';
    var errs = Object.keys(data.errors).sort(function (a, b) { return data.errors[b] - data.errors[a]; }).slice(0, 3);
    h += '<div class="card"><div class="st"><span class="dot">' + ic('warn') + '</span>Questions les plus ratées</div>';
    if (!errs.length) h += '<p class="muted" style="margin:0">Aucune erreur enregistrée pour l\'instant.</p>';
    errs.forEach(function (q) { h += '<div class="err-row"><span>' + esc(q) + '</span><span class="muted">' + data.errors[q] + '×</span></div>'; });
    h += '</div>';
    h += '<div class="card"><div class="st"><span class="dot">' + ic('chat') + '</span>Corrections du professeur</div>';
    if (!data.fixes.length) h += '<p class="muted" style="margin:0">Aucune correction pour l\'instant. Va parler avec le professeur.</p>';
    else {
      h += '<p>' + data.fixes.length + ' correction(s) reçue(s). Les dernières :</p>';
      data.fixes.slice(-3).reverse().forEach(function (f) {
        h += '<div class="err-row"><span><span class="c-old">' + esc(f.original) + '</span><br><b class="ok">' + esc(f.corrected) + '</b></span></div>';
      });
    }
    h += '</div>';
    h += '<div class="card"><div class="st"><span class="dot">' + ic('list') + '</span>Données</div><p class="muted">Ta progression est enregistrée uniquement sur ce téléphone, dans ce navigateur.</p><button class="btn danger block" data-a="reset">Effacer mes données</button></div>';
    return h;
  }

  // ---------- Conversation avec le professeur ----------
  function stopChatAudio() {
    try { if (rec && C.listening) rec.stop(); } catch (e) {}
    try { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); } catch (e) {}
  }
  function chatNote(msg) {
    var n = document.getElementById('chatNote');
    if (n) n.textContent = msg || '';
  }
  function autoGrow(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }
  function setComposerState() {
    var inp = document.getElementById('chatInput'), s = document.getElementById('sendBtn'), m = document.getElementById('micBtn');
    if (!inp) return;
    inp.disabled = C.busy; s.disabled = C.busy; m.disabled = C.busy;
    m.className = 'ib mic' + (C.listening ? ' live' : '');
  }
  function syncComposer() {
    var host = document.getElementById('composerHost'), nav = document.getElementById('nav');
    document.documentElement.style.setProperty('--nav-h', nav.offsetHeight + 'px');
    document.body.classList.toggle('chatmode', S.tab === 'chat');
    if (S.tab !== 'chat') { host.innerHTML = ''; return; }
    host.innerHTML = '<div class="cnote" id="chatNote"></div><div class="composer">' +
      '<button class="ib mic" id="micBtn" aria-label="Parler en anglais" data-a="chatMic">' + ic('mic') + '</button>' +
      '<textarea id="chatInput" rows="1" maxlength="500" placeholder="Écris ou parle en anglais…" aria-label="Ton message en anglais"></textarea>' +
      '<button class="ib send" id="sendBtn" aria-label="Envoyer" data-a="chatSend">' + ic('send') + '</button></div>';
    var inp = document.getElementById('chatInput');
    inp.value = C.draft || '';
    autoGrow(inp);
    setComposerState();
  }

  function chatListHtml() {
    var ch = data.chat, h = '';
    if (!ch.msgs.length) {
      h += '<div class="card"><div class="st"><span class="dot">' + ic('chat') + '</span>Commence une conversation</div>' +
        '<p>Choisis un sujet, ou écris directement ton premier message en anglais. Même un seul mot suffit.</p><div class="starters">';
      STARTERS.forEach(function (s, k) { h += '<button class="btn soft" data-a="chatStart" data-i="' + k + '">' + esc(s.label) + '</button>'; });
      h += '</div>';
      h += '<p class="muted" style="margin:14px 0 8px">Mises en situation</p><div class="starters">';
      SCENE_KEYS.forEach(function (key) { h += '<button class="btn soft" data-a="chatScene" data-s="' + key + '">' + esc(SCENES[key].label) + '</button>'; });
      h += '</div></div>';
      h += '<div class="card tip"><div class="st"><span class="dot">' + ic('bulb') + '</span>À savoir</div>' +
        '<p class="muted">Le professeur est une IA : il peut se tromper. Sa première phrase est fixe, les réponses suivantes sont générées.</p>' +
        '<p class="muted">Tes messages sont envoyés à un service d\'IA (Google Gemini) pour obtenir la réponse. N\'y écris aucune information personnelle (mot de passe, numéro de carte…). Si tu utilises le micro, Chrome envoie ta voix à Google pour la transformer en texte. Ta conversation est gardée uniquement sur ton téléphone.</p>' +
        '<p class="muted" style="margin:0">Le professeur lit seulement le texte : il ne peut pas juger ta prononciation.</p></div>';
      return h;
    }
    ch.msgs.forEach(function (m, i) {
      if (m.role === 'user') {
        h += '<div class="b-row u"><div class="bub u">' + esc(m.content) + '</div></div>';
        return;
      }
      if (m.correction) {
        var c = m.correction;
        h += '<div class="corr"><div class="corr-t">Correction</div><div class="c-old">' + esc(c.original) + '</div><div class="c-new">' + esc(c.corrected) + '</div>' +
          '<p style="margin:0 0 8px">' + esc(c.explanation_fr) + '</p>' +
          (c.example ? '<div class="muted">Exemple : <b>' + esc(c.example) + '</b></div>' : '') +
          '<div class="bact"><button class="btn soft" data-a="chatListenFix" data-i="' + i + '">' + ic('play') + ' Écouter la phrase corrigée</button></div></div>';
      }
      h += '<div class="b-row a"><div class="bub a"><div class="en">' + esc(m.content) + '</div>' +
        (C.openFr[i] && m.fr ? '<div class="fr muted">' + esc(m.fr) + '</div>' : '') +
        '<div class="bact"><button class="ib sm" aria-label="Écouter" data-a="chatListen" data-i="' + i + '">' + ic('play') + '</button>' +
        (m.fr ? '<button class="cbtn" data-a="chatFr" data-i="' + i + '">' + (C.openFr[i] ? 'Masquer' : 'En français') + '</button>' : '') + '</div>' +
        (m.tryEn && i === ch.msgs.length - 1 && !C.busy ? '<button class="tryc" data-a="chatTry" data-i="' + i + '">Tu peux dire : <b>' + esc(m.tryEn) + '</b></button>' : '') +
        '</div></div>';
    });
    if (C.busy) h += '<div class="b-row a"><div class="bub a"><span class="typing" aria-label="Le professeur écrit"><i></i><i></i><i></i></span></div></div>';
    if (C.error) h += '<div class="errbox"><b class="err">Oups.</b> ' + esc(C.error.message) + '<div class="bact"><button class="btn soft" data-a="chatRetry">Réessayer</button></div></div>';
    return h;
  }

  function vChat() {
    var ch = data.chat, h = '';
    h += '<div class="page-h"><h2>Professeur IA</h2><p>Parle ou écris en anglais, le professeur répond et corrige.</p></div>';
    h += '<div class="card"><div class="st" style="margin-bottom:8px">Niveau de la conversation</div><div class="chips">';
    CHAT_LEVELS.forEach(function (l) {
      h += '<button class="cbtn' + (ch.level === l ? ' on' : '') + '" data-a="chatLevel" data-l="' + l + '">' + LEVEL_LABEL[l] + '</button>';
    });
    h += '</div><div class="chips" style="margin-top:10px">' +
      '<button class="cbtn' + (ch.auto ? ' on' : '') + '" data-a="chatAuto">Lecture auto : ' + (ch.auto ? 'oui' : 'non') + '</button>' +
      '<button class="cbtn' + (ch.slow ? ' on' : '') + '" data-a="chatSlow">Voix lente : ' + (ch.slow ? 'oui' : 'non') + '</button>' +
      (ch.msgs.length ? '<button class="cbtn" data-a="chatReset">Nouvelle conversation</button>' : '') + '</div></div>';
    h += '<div id="chatlist">' + chatListHtml() + '</div><div style="height:96px"></div>';
    return h;
  }

  function renderChatList(scroll) {
    var el = document.getElementById('chatlist');
    if (!el || S.tab !== 'chat') return;
    el.innerHTML = chatListHtml();
    if (scroll) window.scrollTo(0, document.body.scrollHeight);
  }

  function voiceRate() { return data.chat.slow ? 0.7 : 0.9; }

  function chatSend() {
    if (C.busy) return;
    var inp = document.getElementById('chatInput');
    var text = (inp ? inp.value : '').trim();
    if (!text) { chatNote('Écris ou dis un message avant d\'envoyer.'); return; }
    try { if (rec && C.listening) rec.stop(); } catch (e) {}
    data.chat.msgs.push({ role: 'user', content: text.slice(0, 500) });
    data.chat.msgs = data.chat.msgs.slice(-40);
    save();
    inp.value = ''; C.draft = ''; autoGrow(inp); chatNote('');
    C.error = null;
    askTeacher();
  }

  async function askTeacher() {
    if (C.busy) return;
    if (navigator.onLine === false) {
      C.error = { message: 'Pas de connexion internet. Vérifie ton réseau, puis réessaie.' };
      renderChatList(true);
      return;
    }
    C.busy = true; C.error = null;
    setComposerState(); renderChatList(true);
    var payload = {
      level: data.chat.level,
      scene: data.chat.scene || null,
      messages: data.chat.msgs.slice(-12).map(function (m) { return { role: m.role, content: m.content }; })
    };
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 25000);
    try {
      var res = await fetch(API_URL + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: ctrl ? ctrl.signal : undefined
      });
      var out = null;
      try { out = await res.json(); } catch (e) { out = null; }
      if (!res.ok || !out || typeof out.reply !== 'string' || !out.reply) {
        throw { api: true, message: (out && out.message) || "Le professeur n'a pas pu répondre. Réessaie dans un instant." };
      }
      var msg = { role: 'assistant', content: out.reply, fr: out.reply_fr || '', correction: out.correction || null, tryEn: out.try_saying || '' };
      data.chat.msgs.push(msg);
      if (msg.correction) {
        data.fixes.push({ original: msg.correction.original, corrected: msg.correction.corrected, explanation_fr: msg.correction.explanation_fr, date: todayStr() });
        data.fixes = data.fixes.slice(-50);
      }
      data.chat.msgs = data.chat.msgs.slice(-40);
      save();
      if (data.chat.auto) speak(msg.content, voiceRate());
    } catch (e) {
      var m2;
      if (e && e.api) m2 = e.message;
      else if (e && e.name === 'AbortError') m2 = 'Le professeur met trop de temps à répondre. Réessaie.';
      else m2 = 'Impossible de joindre le professeur. Vérifie ta connexion, puis réessaie.';
      C.error = { message: m2 };
    } finally {
      clearTimeout(timer);
      C.busy = false;
      setComposerState();
      renderChatList(true);
    }
  }

  function chatMic() {
    var inp = document.getElementById('chatInput');
    if (!inp) return;
    if (C.listening && rec) { try { rec.stop(); } catch (e) {} return; }
    if (!SR) { chatNote("Le micro n'est pas disponible ici. Ouvre la page dans Chrome ou écris ton message."); return; }
    try { window.speechSynthesis.cancel(); } catch (e) {}
    rec = new SR();
    rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
    rec.onstart = function () { C.listening = true; setComposerState(); chatNote("Je t'écoute… Parle en anglais."); };
    rec.onresult = function (ev) {
      var t = ev.results[0][0].transcript;
      inp.value = ((inp.value ? inp.value + ' ' : '') + t).slice(0, 500);
      C.draft = inp.value; autoGrow(inp);
      chatNote('Compris : "' + t + '". Corrige si besoin, puis touche Envoyer.');
    };
    rec.onerror = function (ev) {
      var M = {
        'not-allowed': "Micro refusé. Autorise le micro pour ce site dans les réglages de Chrome.",
        'service-not-allowed': "Micro refusé. Autorise le micro pour ce site dans les réglages de Chrome.",
        'no-speech': "Je n'ai rien entendu. Réessaie plus près du micro.",
        'audio-capture': "Aucun micro détecté.",
        'network': "Problème de réseau : la reconnaissance vocale a besoin d'internet.",
        'aborted': ''
      };
      var msg = (ev.error in M) ? M[ev.error] : ('Erreur du micro : ' + ev.error);
      chatNote(msg);
    };
    rec.onend = function () { C.listening = false; setComposerState(); };
    try { rec.start(); } catch (e) { C.listening = false; setComposerState(); chatNote("Impossible de démarrer le micro : " + e.message); }
  }

  // ---------- Affichage ----------
  function render() {
    var h, key = S.tab + '|' + S.lesson + '|' + S.step + '|' + (S.step === 'quiz' ? S.qi : '') + '|' + (S.review ? 'r' + S.review.i : '');
    if (S.pl) h = vPlacement();
    else if (S.tab === 'home') h = vHome();
    else if (S.tab === 'lessons') {
      if (S.lesson === null) h = vLessons();
      else if (S.step === 'intro') h = vIntro();
      else if (S.step === 'quiz') h = vQuiz();
      else h = vResult();
    }
    else if (S.tab === 'vocab') h = vVocab();
    else if (S.tab === 'chat') h = vChat();
    else h = vProgress();
    app.innerHTML = '<div class="view' + (key !== lastKey ? ' anim' : '') + '">' + h + '</div>';
    lastKey = key;
    syncComposer();
    var btns = document.querySelectorAll('#nav button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].className = btns[i].getAttribute('data-tab') === S.tab ? 'on' : '';
    }
  }

  function goTab(t) {
    S.tab = t; S.review = null; S.pl = null; stopChatAudio();
    if (t === 'lessons') { S.lesson = null; S.step = 'intro'; }
    render(); window.scrollTo(0, 0);
  }

  // ---------- Reconnaissance vocale d'un exemple ----------
  function speakEx(i) {
    var target = cur().examples[i].en, m = document.getElementById('m' + i);
    if (!SR) { m.className = 'msg err'; m.textContent = "Reconnaissance vocale indisponible ici. Ouvre la page dans Chrome."; return; }
    var rec = new SR();
    rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1;
    rec.onstart = function () { m.className = 'msg'; m.textContent = "Je t'écoute... Parle maintenant."; };
    rec.onresult = function (ev) {
      var t = ev.results[0][0].transcript;
      if (norm(t) === norm(target)) { m.className = 'msg ok'; m.textContent = 'Compris : "' + t + '". Identique à la phrase, bravo !'; }
      else { m.className = 'msg warn'; m.textContent = 'Compris : "' + t + '". Différent de la phrase attendue. La reconnaissance n\'est pas parfaite, réessaie.'; }
    };
    rec.onerror = function (ev) {
      var M = {
        'not-allowed': "Micro refusé. Autorise le micro pour ce site dans les réglages de Chrome.",
        'service-not-allowed': "Micro refusé. Autorise le micro pour ce site dans les réglages de Chrome.",
        'no-speech': "Je n'ai rien entendu. Réessaie plus près du micro.",
        'audio-capture': "Aucun micro détecté.",
        'network': "Problème de réseau : la reconnaissance vocale a besoin d'internet."
      };
      m.className = 'msg err'; m.textContent = M[ev.error] || ('Erreur : ' + ev.error);
    };
    try { rec.start(); } catch (e) { m.className = 'msg err'; m.textContent = "Impossible de démarrer le micro : " + e.message; }
  }

  // ---------- Actions ----------
  function onAction(e) {
    var b = e.target.closest('[data-a]');
    if (!b) return;
    var a = b.getAttribute('data-a'), i = parseInt(b.getAttribute('data-i'), 10), L;
    if (a === 'startPl' || a === 'plPick' || a === 'plNext' || a === 'plClose' || a === 'plLessons') { placement(a, i); return; }

    if (a === 'openLesson') { S.tab = 'lessons'; S.lesson = i; S.step = 'intro'; render(); window.scrollTo(0, 0); }
    else if (a === 'backLessons') { S.lesson = null; S.step = 'intro'; S.tab = 'lessons'; render(); window.scrollTo(0, 0); }
    else if (a === 'listenEx') {
      var m = document.getElementById('m' + i);
      if (!speak(cur().examples[i].en)) { m.className = 'msg err'; m.textContent = "Ton navigateur ne sait pas lire à voix haute. Utilise Chrome."; }
    }
    else if (a === 'speakEx') speakEx(i);
    else if (a === 'addAll') {
      var n = 0; cur().vocab.forEach(function (v) { if (addWord(v)) n++; }); save();
      var am = document.getElementById('addmsg'); am.className = 'msg ok';
      am.textContent = n ? (n + ' mot(s) ajouté(s) au carnet.') : 'Ces mots sont déjà dans ton carnet.';
    }
    else if (a === 'startQuiz') { S.step = 'quiz'; S.qi = 0; S.score = 0; S.picked = null; render(); window.scrollTo(0, 0); }
    else if (a === 'pick') {
      if (S.picked !== null) return;
      L = cur(); var q = L.exercises[S.qi];
      S.picked = i;
      if (i === q.answer) S.score++;
      else { data.errors[q.q] = (data.errors[q.q] || 0) + 1; save(); }
      render();
    }
    else if (a === 'next') {
      L = cur();
      if (S.qi + 1 < L.exercises.length) { S.qi++; S.picked = null; }
      else {
        S.step = 'result';
        if (S.score / L.exercises.length >= PASS) {
          var old = data.done[L.id];
          if (!old || S.score >= old.score) data.done[L.id] = { score: S.score, total: L.exercises.length, date: todayStr() };
          save();
        }
      }
      render(); window.scrollTo(0, 0);
    }
    else if (a === 'speakWord') speak(decodeURIComponent(b.getAttribute('data-w')));
    else if (a === 'startReview') {
      var queue = dueWords();
      if (!queue.length) return;
      S.tab = 'vocab'; S.review = { queue: queue, i: 0, shown: false }; render(); window.scrollTo(0, 0);
    }
    else if (a === 'reveal') { S.review.shown = true; render(); }
    else if (a === 'rate') {
      var R = S.review, w = R.queue[R.i], v = data.vocab[w], val = parseInt(b.getAttribute('data-v'), 10);
      if (val === 2) { v.next = addDays(INTERVALS[v.box]); v.box = Math.min(v.box + 1, INTERVALS.length - 1); }
      else if (val === 1) { v.next = addDays(1); }
      else { v.box = 0; v.next = addDays(1); }
      save(); R.i++; R.shown = false; render();
    }
    else if (a === 'endReview') { S.review = null; render(); }
    else if (a === 'goChat') { goTab('chat'); }
    else if (a === 'chatStart') {
      var st = STARTERS[i];
      if (!st) return;
      data.chat.msgs = [{ role: 'assistant', content: st.en, fr: st.fr, tryEn: st.tryEn, local: true }];
      data.chat.scene = null;
      C.openFr = {}; C.error = null; save(); render(); window.scrollTo(0, 0);
      if (data.chat.auto) speak(st.en, voiceRate());
    }
    else if (a === 'chatScene') {
      var skey = b.getAttribute('data-s'), sc = SCENES[skey];
      if (!sc) return;
      data.chat.msgs = [{ role: 'assistant', content: sc.en, fr: sc.fr, tryEn: sc.tryEn, local: true }];
      data.chat.scene = skey;
      C.openFr = {}; C.error = null; save(); render(); window.scrollTo(0, 0);
      if (data.chat.auto) speak(sc.en, voiceRate());
    }
    else if (a === 'chatLevel') {
      var lv = b.getAttribute('data-l');
      if (CHAT_LEVELS.indexOf(lv) !== -1) { data.chat.level = lv; save(); render(); }
    }
    else if (a === 'chatAuto') { data.chat.auto = !data.chat.auto; save(); render(); }
    else if (a === 'chatSlow') { data.chat.slow = !data.chat.slow; save(); render(); }
    else if (a === 'chatReset') {
      if (confirm('Commencer une nouvelle conversation ? La conversation actuelle sera effacée.')) {
        data.chat.msgs = []; data.chat.scene = null; C.openFr = {}; C.error = null; save(); render();
      }
    }
    else if (a === 'chatListen') { var m1 = data.chat.msgs[i]; if (m1) speak(m1.content, voiceRate()); }
    else if (a === 'chatListenFix') { var m3 = data.chat.msgs[i]; if (m3 && m3.correction) speak(m3.correction.corrected, voiceRate()); }
    else if (a === 'chatFr') { C.openFr[i] = !C.openFr[i]; renderChatList(false); }
    else if (a === 'chatTry') {
      var m4 = data.chat.msgs[i], ti = document.getElementById('chatInput');
      if (m4 && ti) { ti.value = m4.tryEn; C.draft = ti.value; autoGrow(ti); ti.focus(); }
    }
    else if (a === 'chatMic') chatMic();
    else if (a === 'chatSend') chatSend();
    else if (a === 'chatRetry') askTeacher();
    else if (a === 'install') {
      if (!installEvent) return;
      installEvent.prompt();
      installEvent.userChoice.then(function () { installEvent = null; render(); });
    }
    else if (a === 'reset') {
      if (confirm('Effacer toute ta progression et ton carnet ?')) {
        data = { done: {}, vocab: {}, errors: {}, chat: { msgs: [], level: 'A1', slow: false, auto: true }, fixes: [] };
        C.draft = ''; C.openFr = {}; C.error = null; save(); render();
      }
    }
  }
  app.addEventListener('click', onAction);
  document.getElementById('composerHost').addEventListener('click', onAction);

  document.getElementById('nav').addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]');
    if (b) goTab(b.getAttribute('data-tab'));
  });

  var composerHost = document.getElementById('composerHost');
  composerHost.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'chatInput') { C.draft = e.target.value; autoGrow(e.target); }
  });
  composerHost.addEventListener('keydown', function (e) {
    if (e.target && e.target.id === 'chatInput' && e.key === 'Enter' && !e.shiftKey && window.matchMedia('(hover:hover)').matches) {
      e.preventDefault(); chatSend();
    }
  });

  // ---------- Installation (PWA) ----------
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    installEvent = e;
    if (S.tab === 'home') render();
  });
  window.addEventListener('appinstalled', function () {
    installEvent = null;
    if (S.tab === 'home') render();
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }

  load();
  render();
})();
</script>
</body>
</html>
